[tools]
# Pinned to the runtime the systemd units already launch these proxies with.
node = "26.5.1"

[env]
OLLAMA_THINK_PORT = "3446"

[tasks.think]
description = "Run the Ollama think proxy in the foreground (native /api/chat, thinking forced off)"
run = "node ollama-think/proxy.mjs"

[tasks.anthropic]
description = "Run the Ollama->Anthropic proxy in the foreground (Anthropic Messages for Claude Code)"
run = "node ollama-anthropic/proxy.mjs"

[tasks.health]
description = "Check both proxies' /healthz endpoints"
run = '''
#!/usr/bin/env bash
set -uo pipefail
for p in "${OLLAMA_THINK_PORT:-3446}" "${PROXY_PORT:-3445}"; do
    printf '%s: ' "$p"
    curl -fsS --max-time 3 "http://127.0.0.1:$p/healthz" || echo "not responding"
    echo
done
'''

[tasks.install]
description = "Install both proxies as systemd --user services pointing at this checkout"
run = '''
#!/usr/bin/env bash
set -euo pipefail

REPO="$(cd "$(dirname "${BASH_SOURCE[0]:-$PWD}")" && pwd)"
UNIT_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
NODE="$(command -v node)"
mkdir -p "$UNIT_DIR"

write_unit() {
    local name="$1" script="$2" port="$3" desc="$4"
    cat > "$UNIT_DIR/$name.service" <<UNIT
[Unit]
Description=$desc
After=network-online.target

[Service]
Type=simple
ExecStart=$NODE $REPO/$script
Restart=on-failure
RestartSec=3
EnvironmentFile=${XDG_CONFIG_HOME:-$HOME/.config}/ollama-anthropic-proxy/env
Environment=PROXY_PORT=$port
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=default.target
UNIT
    echo "wrote $UNIT_DIR/$name.service"
}

write_unit ollama-anthropic-proxy ollama-anthropic/proxy.mjs 3445 \
    "Ollama Cloud -> Anthropic Messages proxy for Claude Code"
write_unit ollama-think-proxy ollama-think/proxy.mjs 3446 \
    "Ollama Cloud native proxy with thinking forced off"

systemctl --user daemon-reload
echo "Now: systemctl --user enable --now ollama-anthropic-proxy ollama-think-proxy"
'''
